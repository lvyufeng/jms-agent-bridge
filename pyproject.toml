[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jms-agent-bridge"
version = "0.1.0"
description = "MCP bridge for JumpServer: drive heterogeneous GPU/NPU clusters from Claude Code over the audited bastion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "lvyufeng" }]
keywords = ["jumpserver", "mcp", "bastion", "torch", "federated-learning", "ascend", "cuda"]
dependencies = [
    # Major-version caps: the code depends on mcp 2.x's MCPServer/ToolError surface and
    # on httpx's client API specifically, so a future major is an explicit bump, not a
    # silent `pip install` surprise.
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    # tomllib is stdlib only from 3.11; config.py falls back to tomli on 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Optional: keep a saved JumpServer password in the OS keyring rather than a 0600 file.
# Deliberately an extra — a hard dependency would change the clone-and-run install for
# everyone to spare `login --save-password` a plaintext fallback it already handles.
keyring = ["keyring>=24.0"]
# Pinned exactly: these define the test environment, so a run must mean the same thing
# on every machine and on CI. Runtime deps above stay on ranges for downstream users.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.12",
]

[project.scripts]
jms-bridge = "jms_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/lvyufeng/jms-agent-bridge"

[tool.hatch.build.targets.wheel]
packages = ["src/jms_bridge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"